services:
  postgres:
    image: postgres:15-alpine
    container_name: ottoflow-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ottoflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d ottoflow" ]
      interval: 2s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ottoflow-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 2s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      args:
        SERVICE_NAME: api
    container_name: ottoflow-api
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/ottoflow?sslmode=disable
      - PORT=8080
    depends_on:
      postgres:
        condition: service_healthy

  webhook:
    build:
      context: .
      args:
        SERVICE_NAME: webhook
    container_name: ottoflow-webhook
    ports:
      - "8081:8081"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/ottoflow?sslmode=disable
      - PORT=8081
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      args:
        SERVICE_NAME: worker
    container_name: ottoflow-worker
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/ottoflow?sslmode=disable
      - REDIS_ADDR=redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
